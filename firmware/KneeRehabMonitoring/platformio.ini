; PlatformIO project (sketch stays as KneeRehabMonitoring.ino in this folder)
; Docs: https://docs.platformio.org/en/latest/projectconf/index.html
;
; Change [env:...] to match your board:
;   Uno / Nano (ATmega328): env below
;   Nano Every: board = nano_every, platform = atmelmegaavr
;   ESP32: different platform + board — see PlatformIO boards explorer

[platformio]
src_dir = .

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
lib_deps =
  bblanchon/ArduinoJson @ ^6.21.5
